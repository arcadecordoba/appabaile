<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Caras</title>
<style>
:root{--bg:#0f1720;--panel:#17212c;--line:#263443;--fg:#e8eef4;--mut:#8fa3b5;--acc:#3ddc97;--warn:#ffb454;--bad:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f3f6f9;--panel:#fff;--line:#d5dee7;--fg:#13202c;--mut:#5b6e80;--acc:#0f9d63;--warn:#b86e00;--bad:#c93232}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:8px;font:inherit;font-weight:600}
nav button[aria-selected=true]{color:var(--bg);background:var(--acc);border-color:var(--acc)}
section[hidden]{display:none}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button.b{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:600}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.d{color:var(--bad)}
button:disabled{opacity:.5}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.who{font-size:17px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.person{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.person:last-child{border-bottom:0}
.person>div{min-width:0}
.person .n{font-weight:700;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px}
.msg{padding:10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);margin:10px 0;color:var(--mut)}
.consent{display:flex;gap:10px;align-items:flex-start;margin:14px 0;color:var(--fg);font-size:14px}
.consent input{margin-top:3px;width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<h1>Caras</h1>
<nav role="tablist">
  <button role="tab" id="t-rec" aria-selected="true">Reconocer</button>
  <button role="tab" id="t-reg" aria-selected="false">Registrar</button>
  <button role="tab" id="t-per" aria-selected="false">Personas</button>
</nav>

<div id="status" class="msg">Cargando modelos de reconocimiento…</div>

<section id="v-rec">
  <div class="stage"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div>
  <div class="row">
    <button class="b p" id="btnCam">Activar cámara</button>
    <button class="b" id="btnFlip">Girar cámara</button>
  </div>
  <div id="found"></div>
  <p class="mut">Solo reconoce a personas registradas con su consentimiento. Si no está seguro, muestra “No registrada”.</p>
</section>

<section id="v-reg" hidden>
  <div class="stage"><video id="vid2" playsinline muted></video></div>
  <div class="row">
    <button class="b p" id="btnCam2">Activar cámara</button>
    <button class="b" id="btnSample" disabled>Capturar muestra (0/3)</button>
  </div>
  <label for="name">Nombre</label>
  <input type="text" id="name" autocomplete="off">
  <label for="notes">Datos (relación, empresa, notas)</label>
  <textarea id="notes" rows="3"></textarea>
  <label for="group">Tipo</label>
  <select id="group"><option value="contacto">Contacto personal</option><option value="evento">Evento</option></select>
  <div id="expWrap" hidden>
    <label for="exp">Borrar automáticamente después de</label>
    <input type="date" id="exp">
  </div>
  <label class="consent"><input type="checkbox" id="consent"><span>La persona sabe que se guarda su rostro en este dispositivo y aceptó.</span></label>
  <button class="b p" id="btnSave" disabled>Guardar persona</button>
</section>

<section id="v-per" hidden>
  <div class="row">
    <button class="b" id="btnExport">Exportar datos</button>
    <button class="b d" id="btnWipe">Borrar todo</button>
  </div>
  <div class="card" id="list"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
/* ============ NÚCLEO (sin interfaz): reutilizable en gafas smart ============
   FaceCore.init() carga modelos. FaceCore.analyze(fuente) devuelve rostros con
   caja y descriptor. FaceCore.match(descriptor, personas) devuelve la mejor
   coincidencia o null. Cualquier pantalla (celular, gafas) solo llama a esto. */
const FaceCore = (() => {
  const MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
  const THRESHOLD = 0.5; // más bajo = más estricto (0.6 es el valor habitual)
  const opts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  return {
    THRESHOLD,
    async init() {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)
      ]);
    },
    async analyze(source) {
      return faceapi.detectAllFaces(source, opts()).withFaceLandmarks().withFaceDescriptors();
    },
    async largest(source) {
      const all = await this.analyze(source);
      if (!all.length) return null;
      return all.sort((a, b) => b.detection.box.area - a.detection.box.area)[0];
    },
    match(descriptor, people) {
      let best = null;
      for (const p of people) {
        for (const d of p.descriptors) {
          const dist = faceapi.euclideanDistance(descriptor, Float32Array.from(d));
          if (!best || dist < best.dist) best = { person: p, dist };
        }
      }
      return best && best.dist <= THRESHOLD ? best : null;
    }
  };
})();

/* ============ ALMACÉN LOCAL (IndexedDB, solo en este dispositivo) ============ */
const Store = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('caras', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('people', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('people', mode); const s = t.objectStore('people');
    const out = fn(s); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error);
  });
  return {
    open,
    all: () => tx('readonly', s => s.getAll()),
    put: p => tx('readwrite', s => s.put(p)),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear()),
    async purgeExpired() {
      const today = new Date().toISOString().slice(0, 10);
      for (const p of await this.all()) if (p.expires && p.expires < today) await this.del(p.id);
    }
  };
})();

/* ============ INTERFAZ DEL CELULAR ============ */
const $ = id => document.getElementById(id);
let people = [], facing = 'environment', streams = {}, loop = null, samples = [];

function setStatus(t, hide) { $('status').textContent = t; $('status').hidden = !!hide; }

async function startCam(videoEl) {
  stopCam(videoEl);
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 960 } }, audio: false });
  videoEl.srcObject = s; streams[videoEl.id] = s; await videoEl.play();
}
function stopCam(videoEl) {
  const s = streams[videoEl.id]; if (s) s.getTracks().forEach(t => t.stop());
  videoEl.srcObject = null; delete streams[videoEl.id];
}

function show(tab) {
  for (const [k, v] of [['rec', 'v-rec'], ['reg', 'v-reg'], ['per', 'v-per']]) {
    $(v).hidden = k !== tab; $('t-' + k).setAttribute('aria-selected', k === tab);
  }
  if (tab !== 'rec') { clearInterval(loop); loop = null; stopCam($('vid')); }
  if (tab !== 'reg') stopCam($('vid2'));
  if (tab === 'per') renderList();
}
$('t-rec').onclick = () => show('rec'); $('t-reg').onclick = () => show('reg'); $('t-per').onclick = () => show('per');

/* --- Reconocer --- */
function draw(results) {
  const v = $('vid'), c = $('ov');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const found = [];
  for (const r of results) {
    const m = FaceCore.match(r.descriptor, people);
    const b = r.detection.box;
    g.lineWidth = Math.max(3, c.width / 200); g.strokeStyle = m ? '#3ddc97' : '#ffb454';
    g.strokeRect(b.x, b.y, b.width, b.height);
    const label = m ? m.person.name : 'No registrada';
    g.font = `600 ${Math.max(16, c.width / 28)}px system-ui`;
    const w = g.measureText(label).width + 12, h = Math.max(24, c.width / 22);
    g.fillStyle = m ? '#3ddc97' : '#ffb454'; g.fillRect(b.x, Math.max(0, b.y - h), w, h);
    g.fillStyle = '#0f1720'; g.fillText(label, b.x + 6, Math.max(h - 7, b.y - 7));
    if (m) found.push(m);
  }
  renderFound(found);
}
function renderFound(found) {
  const box = $('found'); box.replaceChildren();
  for (const m of found) {
    const card = document.createElement('div'); card.className = 'card';
    const n = document.createElement('div'); n.className = 'who'; n.textContent = m.person.name;
    const g = document.createElement('span'); g.className = 'tag'; g.textContent = m.person.group === 'evento' ? 'Evento' : 'Contacto'; n.append(g);
    const d = document.createElement('div'); d.textContent = m.person.notes || 'Sin datos cargados';
    const c = document.createElement('div'); c.className = 'mut'; c.textContent = 'Coincidencia: ' + Math.round((1 - m.dist) * 100) + '%';
    card.append(n, d, c); box.append(card);
  }
}
async function startRecognition() {
  try { await startCam($('vid')); } catch (e) { return setStatus('No se pudo abrir la cámara. Revisá el permiso del navegador.'); }
  people = await Store.all();
  if (!people.length) setStatus('Todavía no hay personas registradas. Andá a “Registrar”.'); else setStatus('', true);
  clearInterval(loop);
  let busy = false;
  loop = setInterval(async () => {
    if (busy || $('vid').readyState < 2) return; busy = true;
    try { draw(await FaceCore.analyze($('vid'))); } finally { busy = false; }
  }, 450);
}
$('btnCam').onclick = startRecognition;
$('btnFlip').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; if (streams.vid) await startRecognition(); else if (streams.vid2) await startCam($('vid2')); };

/* --- Registrar --- */
function refreshSave() { $('btnSave').disabled = !($('name').value.trim() && $('consent').checked && samples.length >= 3); }
$('name').oninput = refreshSave; $('consent').onchange = refreshSave;
$('group').onchange = () => { $('expWrap').hidden = $('group').value !== 'evento'; };
$('btnCam2').onclick = async () => {
  try { await startCam($('vid2')); $('btnSample').disabled = false; setStatus('', true); }
  catch (e) { setStatus('No se pudo abrir la cámara. Revisá el permiso del navegador.'); }
};
$('btnSample').onclick = async () => {
  const f = await FaceCore.largest($('vid2'));
  if (!f) return setStatus('No se ve ninguna cara. Acercate y probá de nuevo.');
  setStatus('', true);
  samples.push(Array.from(f.descriptor));
  $('btnSample').textContent = `Capturar muestra (${Math.min(samples.length, 3)}/3)` + (samples.length >= 3 ? ' ✓' : '');
  refreshSave();
};
$('btnSave').onclick = async () => {
  await Store.put({
    id: crypto.randomUUID(), name: $('name').value.trim(), notes: $('notes').value.trim(),
    group: $('group').value, expires: $('group').value === 'evento' ? $('exp').value || null : null,
    consent: true, created: new Date().toISOString(), descriptors: samples
  });
  samples = []; $('name').value = ''; $('notes').value = ''; $('consent').checked = false;
  $('btnSample').textContent = 'Capturar muestra (0/3)'; refreshSave();
  setStatus('Persona guardada en este dispositivo.');
};

/* --- Personas --- */
async function renderList() {
  people = await Store.all();
  const box = $('list'); box.replaceChildren();
  if (!people.length) { box.textContent = 'No hay personas registradas.'; return; }
  for (const p of people) {
    const row = document.createElement('div'); row.className = 'person';
    const left = document.createElement('div');
    const n = document.createElement('div'); n.className = 'n'; n.textContent = p.name;
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = p.group === 'evento' ? 'Evento' : 'Contacto'; n.append(t);
    const d = document.createElement('div'); d.className = 'mut'; d.textContent = (p.notes || 'Sin datos') + (p.expires ? ' · se borra el ' + p.expires : '');
    left.append(n, d);
    const del = document.createElement('button'); del.className = 'b d'; del.textContent = 'Borrar';
    del.onclick = async () => { await Store.del(p.id); renderList(); };
    row.append(left, del); box.append(row);
  }
}
$('btnExport').onclick = async () => {
  const data = (await Store.all()).map(({ descriptors, ...rest }) => rest); // sin los vectores faciales
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'personas.json'; a.click(); URL.revokeObjectURL(url);
};
$('btnWipe').onclick = async () => {
  if ($('btnWipe').dataset.sure !== '1') { $('btnWipe').dataset.sure = '1'; $('btnWipe').textContent = 'Tocá de nuevo para confirmar'; return; }
  await Store.clear(); $('btnWipe').dataset.sure = ''; $('btnWipe').textContent = 'Borrar todo'; renderList();
};

/* --- Inicio --- */
(async () => {
  try {
    await Store.open(); await Store.purgeExpired();
    if (typeof faceapi === 'undefined') throw new Error('lib');
    await FaceCore.init();
    setStatus('Listo. Activá la cámara.');
  } catch (e) {
    setStatus('No se pudieron cargar los modelos. Abrí la página con internet y desde una dirección https.');
  }
})();
</script>
</body>
</html>
